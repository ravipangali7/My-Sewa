# MySewa — nginx site for mysewa.sewabyapar.com
#
# Serves the SPA from /var/www/mysewa/web/dist and proxies API + media to Gunicorn.
# Install:
#   sudo cp deploy/nginx-mysewa.conf /etc/nginx/sites-available/mysewa.sewabyapar.com
#   sudo ln -sf /etc/nginx/sites-available/mysewa.sewabyapar.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name mysewa.sewabyapar.com;

    # Redirect HTTP → HTTPS when certs exist (certbot will adjust this block).
    # return 301 https://$host$request_uri;

    root /var/www/mysewa/web/dist;
    index index.html;

    client_max_body_size 20M;

    # Django REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Uploaded media (deposit screenshots, avatars, QR)
    location /media/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin (Jazzmin) — optional; keep if you use /database/
    location /database/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
    }

    # Hashed Vite assets — long cache
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

