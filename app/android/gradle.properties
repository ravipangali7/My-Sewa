# ~7–8 GB RAM: balance heap vs Metaspace. LintVital was OOMing Metaspace at 384m.
org.gradle.jvmargs=-Xmx1152m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
org.gradle.daemon=true
org.gradle.vfs.watch=false
kotlin.daemon.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.lint.checkReleaseBuilds=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
